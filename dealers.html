<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangalore Luxury Car Dealerships | Sheet View</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    th, td { white-space: nowrap; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 p-6">
  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center justify-between pb-6 border-b border-gray-200 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">🏎️ Bangalore Luxury Car Dealerships — Sheet View</h1>
        <p class="text-sm text-gray-500 mt-1">40 Verified Dealerships across 5 Hub Corridors in Bengaluru</p>
      </div>
      <div class="flex items-center gap-3">
        <a href="/bangalore_luxury_car_dealerships_queue.csv" download class="inline-flex items-center px-4 py-2 border border-gray-300 rounded-lg text-sm font-medium bg-white text-gray-700 hover:bg-gray-50 shadow-sm transition">
          📥 Download CSV
        </a>
        <a href="https://gist.github.com/patrickabrahamprince/d7f9bd775637dec4f8f60cc053276125" target="_blank" class="inline-flex items-center px-4 py-2 rounded-lg text-sm font-medium bg-black text-white hover:bg-gray-800 shadow-sm transition">
          🌐 View on GitHub Sheet
        </a>
      </div>
    </div>

    <!-- Search & Filters -->
    <div class="my-4 flex flex-col sm:flex-row gap-3">
      <input type="text" id="searchInput" placeholder="Search by name, phone, or area..." class="w-full sm:w-80 px-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
      <select id="corridorFilter" class="px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value="">All Corridors (5)</option>
        <option value="Corridor 2">Corridor 2: Indiranagar & Domlur</option>
        <option value="Corridor 3">Corridor 3: CBD & Richmond Town</option>
        <option value="Corridor 4">Corridor 4: Outer Ring Road & Bellandur</option>
        <option value="Corridor 5">Corridor 5: Hebbal & Airport Corridor</option>
        <option value="Corridor 6">Corridor 6: South Bengaluru</option>
      </select>
    </div>

    <!-- Table Container -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
      <div class="overflow-x-auto max-h-[75vh]">
        <table class="min-w-full divide-y divide-gray-200 text-left text-sm" id="dealersTable">
          <thead class="bg-gray-100 sticky top-0 z-10 text-xs font-semibold text-gray-600 uppercase tracking-wider">
            <tr>
              <th class="py-3 px-4">#</th>
              <th class="py-3 px-4">Dealership Name</th>
              <th class="py-3 px-4">Corridor</th>
              <th class="py-3 px-4">Area / Locality</th>
              <th class="py-3 px-4">Primary Phone</th>
              <th class="py-3 px-4">Secondary Phone</th>
              <th class="py-3 px-4">WhatsApp Link</th>
              <th class="py-3 px-4">Specialization</th>
              <th class="py-3 px-4">Full Address</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-100 bg-white" id="tableBody">
            <!-- Dynamically populated -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    fetch('/bangalore_luxury_car_dealerships_queue.csv')
      .then(res => res.text())
      .then(csvText => {
        const lines = csvText.trim().split('\n');
        const rows = [];
        for (let i = 1; i < lines.length; i++) {
          const line = lines[i];
          if (!line) continue;
          // Simple CSV parser for quoted strings
          const regex = /(?:,|\n|^)("(?:(?:"")*[^"]*)*"|[^",\n]*|(?:\n|$))/g;
          const cols = [];
          let match;
          while ((match = regex.exec(line)) && cols.length < 9) {
            let val = match[1] || '';
            if (val.startsWith('"') && val.endsWith('"')) {
              val = val.substring(1, val.length - 1).replace(/""/g, '"');
            }
            cols.push(val);
          }
          if (cols.length >= 8) rows.push(cols);
        }

        const tbody = document.getElementById('tableBody');
        function renderRows(filtered) {
          tbody.innerHTML = filtered.map(c => `
            <tr class="hover:bg-blue-50/50 transition">
              <td class="py-3 px-4 font-mono text-gray-500">${c[0] || ''}</td>
              <td class="py-3 px-4 font-semibold text-gray-900">${c[1] || ''}</td>
              <td class="py-3 px-4"><span class="px-2 py-0.5 text-xs font-medium rounded-full bg-blue-100 text-blue-800">${c[2] || ''}</span></td>
              <td class="py-3 px-4 text-gray-700">${c[3] || ''}</td>
              <td class="py-3 px-4 font-mono font-medium text-emerald-700"><a href="tel:${(c[4]||'').replace(/[^0-9+]/g,'')}" class="hover:underline">${c[4] || ''}</a></td>
              <td class="py-3 px-4 font-mono text-gray-500">${c[5] ? `<a href="tel:${c[5].replace(/[^0-9+]/g,'')}" class="hover:underline">${c[5]}</a>` : '—'}</td>
              <td class="py-3 px-4">${c[6] ? `<a href="${c[6]}" target="_blank" class="inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded bg-green-500 text-white font-medium hover:bg-green-600 transition">💬 WhatsApp</a>` : '—'}</td>
              <td class="py-3 px-4 text-xs text-gray-600 max-w-xs truncate" title="${c[8] || ''}">${c[8] || ''}</td>
              <td class="py-3 px-4 text-xs text-gray-500 max-w-sm truncate" title="${c[7] || ''}">${c[7] || ''}</td>
            </tr>
          `).join('');
        }

        renderRows(rows);

        const searchInput = document.getElementById('searchInput');
        const corridorFilter = document.getElementById('corridorFilter');

        function applyFilter() {
          const q = searchInput.value.toLowerCase();
          const corridor = corridorFilter.value.toLowerCase();
          const filtered = rows.filter(r => {
            const matchesText = r.some(col => (col || '').toLowerCase().includes(q));
            const matchesCorridor = !corridor || (r[2] || '').toLowerCase().includes(corridor);
            return matchesText && matchesCorridor;
          });
          renderRows(filtered);
        }

        searchInput.addEventListener('input', applyFilter);
        corridorFilter.addEventListener('change', applyFilter);
      });
  </script>
</body>
</html>
